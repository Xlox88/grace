<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prescription for Grace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ea;
    --paper-edge: #eee7d8;
    --ink: #232a35;
    --ink-soft: #5b6472;
    --red: #b23a3a;
    --line: #c9c0ab;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d8d2c2;
    background-image: radial-gradient(circle at 20% 20%, rgba(0,0,0,0.03), transparent 60%);
    font-family: 'Courier Prime', 'Courier New', monospace;
    color: var(--ink);
    padding: 32px 16px;
  }

  .pad {
    position: relative;
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,0.18);
    padding: 28px 22px 24px 34px;
  }

  .pad::before {
    content: "";
    position: absolute;
    left: 16px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--red);
    opacity: 0.55;
  }

  .pad::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background-image: repeating-linear-gradient(90deg, transparent, transparent 10px, var(--paper-edge) 10px, var(--paper-edge) 12px);
    background-color: #d8d2c2;
  }

  .pad-title {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    color: var(--red);
    font-size: 30px;
    line-height: 1;
    transform: rotate(-1deg);
  }

  .fields {
    margin-top: 20px;
    display: grid;
    gap: 10px;
  }

  .field {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
  }

  .field .label {
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }

  .field .value {
    flex: 1;
    border-bottom: 1px dotted var(--line);
    padding-bottom: 2px;
  }

  .rx {
    margin-top: 22px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .rx-symbol {
    font-size: 34px;
    font-family: Georgia, serif;
    color: var(--red);
    line-height: 1;
    transform: translateY(-2px);
  }

  .prescription-text {
    font-size: 14.5px;
    line-height: 1.55;
    padding-top: 6px;
  }

  button.main-btn {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  button.main-btn:hover { background: #333c4a; }
  button.main-btn:active { transform: scale(0.98); }
  button.main-btn:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  button.main-btn:disabled { opacity: 0.55; cursor: default; }

  .cats {
    margin-top: 20px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.5s ease, opacity 0.4s ease;
  }

  .cats.show {
    max-height: 500px;
    opacity: 1;
  }

  .cats-label {
    text-align: center;
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .cats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .cat-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .cat-photo-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    border: 1px solid var(--line);
    cursor: pointer;
    background: #efe9d8;
  }

  .cat-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }

  .cat-photo-wrap:active img {
    transform: scale(0.97);
  }

  .cat-name {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
  }

  .emoji-pop {
    position: absolute;
    font-size: 46px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }

  .emoji-pop.pop-a {
    animation: popIn 0.4s ease-out forwards;
  }

  .emoji-pop.pop-b {
    animation: popIn 0.4s ease-out forwards;
    animation-delay: 0.65s;
  }

  @keyframes popIn {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    60%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .emoji-pop { animation: none !important; opacity: 1; transform: translate(-50%, -50%) scale(1); }
    button.main-btn, button.main-btn:active { transition: none; transform: none; }
    .cat-photo-wrap:active img { transform: none; }
  }

  .footer {
    margin-top: 20px;
    font-size: 10.5px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div class="pad">
  <div class="pad-title">Dr. Nico's Urgent Care</div>

  <div class="fields">
    <div class="field"><span class="label">PATIENT</span><span class="value">Grace Bain</span></div>
    <div class="field"><span class="label">DATE</span><span class="value" id="date"></span></div>
    <div class="field"><span class="label">DIAGNOSIS</span><span class="value">being a sick baby</span></div>
  </div>

<script>
  const dateEl = document.getElementById('date');
  dateEl.textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

  const revealBtn = document.getElementById('revealBtn');
  const cats = document.getElementById('cats');

  revealBtn.addEventListener('click', () => {
    cats.classList.add('show');
    revealBtn.disabled = true;
    revealBtn.textContent = "Instructions followed";
  });

  const nellieWrap = document.getElementById('nellieWrap');
  nellieWrap.addEventListener('click', () => {
    nellieWrap.querySelectorAll('.emoji-pop').forEach(el => el.remove());

    const yarn = document.createElement('div');
    yarn.className = 'emoji-pop pop-a';
    yarn.textContent = '\u{1F9F6}';
    nellieWrap.appendChild(yarn);

    const thumb = document.createElement('div');
    thumb.className = 'emoji-pop pop-b';
    thumb.textContent = '\u{1F44D}';
    nellieWrap.appendChild(thumb);

    setTimeout(() => {
      yarn.remove();
      thumb.remove();
    }, 2400);
  });

  const albertWrap = document.getElementById('albertWrap');
  const albertAudio = document.getElementById('albertAudio');
  albertWrap.addEventListener('click', () => {
    albertAudio.currentTime = 0;
    albertAudio.play().catch(() => {});
  });
</script>
