<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0712">
<title>The Haunting of Grace House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Creepster&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--void:#0b0712;--panel:#191122;--edge:#3a2740;--ink:#ece0cf;--dim:#a992a0;--amber:#f3a847;--amber2:#c8842f;--crt:#5dff8a;box-sizing:border-box;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:radial-gradient(120% 80% at 50% 0%,#1a1026 0%,var(--void) 70%);color:var(--ink);font-family:"Pixelify Sans",system-ui,sans-serif;display:flex;justify-content:center;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none;touch-action:none;}
input,textarea{user-select:text;-webkit-user-select:text;touch-action:auto;font-family:inherit;}
#wrap{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;}
#hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 6px;font-size:17px;}
#roomName{color:var(--dim);font-size:15px;}
#falafel{color:var(--amber);} #falafel b{color:var(--ink);font-weight:600;}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 8px;}
canvas#game{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%;border:2px solid var(--edge);border-radius:6px;background:#07040c;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:filter .8s;}
#controls{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 20px 18px;gap:12px;}
.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;}
.btn{background:var(--panel);border:2px solid var(--edge);color:var(--ink);border-radius:10px;font-family:inherit;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .05s,background .1s;}
.btn:active,.btn.pressed{background:#2a1d38;transform:scale(.94);}
#up{grid-column:2;grid-row:1;}#left{grid-column:1;grid-row:2;}#right{grid-column:3;grid-row:2;}#down{grid-column:2;grid-row:3;}
#act{width:74px;height:74px;border-radius:50%;font-family:"Creepster",cursive;font-size:26px;color:var(--amber);align-self:center;}
.overlay{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;}
.overlay.show{display:flex;}
#title{background:radial-gradient(130% 90% at 50% 30%,#1c1130 0%,#07040c 75%);z-index:30;}
#title h1{font-family:"Creepster",cursive;font-weight:400;font-size:clamp(42px,13vw,74px);line-height:.95;margin:0;text-shadow:0 0 18px rgba(243,168,71,.35),2px 3px 0 #000;}
#title .sub{color:var(--amber2);font-size:16px;margin:14px 0 2px;letter-spacing:1px;}
#title .enter{margin-top:38px;color:var(--dim);font-size:15px;animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#dialogue{justify-content:flex-end;padding:0;z-index:20;}
.dbox{width:100%;background:var(--panel);border-top:2px solid var(--edge);padding:16px 20px 20px;text-align:left;box-shadow:0 -10px 30px rgba(0,0,0,.5);}
.dbox .who{color:var(--amber);font-size:14px;margin-bottom:6px;min-height:1em;}
.dbox .who.think{color:#9fb4d8;}
.dbox .txt{font-size:19px;line-height:1.4;min-height:3.4em;}
.dbox .txt.think{font-style:italic;color:#d6dcef;}
.dbox .hint{color:var(--dim);font-size:13px;text-align:right;margin-top:6px;}
.choices{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.choices button,.pbtn{flex:1;min-width:110px;background:#231634;border:2px solid var(--edge);color:var(--ink);font-family:inherit;font-size:17px;padding:12px;border-radius:10px;}
.choices button:active,.pbtn:active{background:#2f2046;}
#panel{background:rgba(7,4,12,.88);z-index:15;}
.pbox{width:100%;max-width:400px;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:18px;transition:filter .9s;}
.pbox h2{font-family:"Creepster",cursive;font-weight:400;font-size:28px;margin:0 0 8px;}
.pbox p{color:var(--dim);font-size:15px;line-height:1.4;margin:6px 0;}
.prow{display:flex;gap:10px;margin-top:12px;}
.crt{background:#071a0d;border:3px solid #3b3a33;border-radius:10px;padding:16px;color:var(--crt);font-family:"Courier New",monospace;text-align:left;box-shadow:inset 0 0 30px rgba(93,255,138,.15);min-height:170px;}
.crt .l{margin:5px 0;font-size:15px;}
.crt .big{font-size:20px;letter-spacing:1px;}
.crt input{width:100%;background:#031007;border:1px solid #1f6b35;color:var(--crt);font-family:"Courier New",monospace;font-size:18px;padding:8px;margin-top:8px;border-radius:4px;outline:none;}
textarea.poem{width:100%;height:150px;background:#f4ecd8;color:#2a2018;border:none;border-radius:6px;padding:12px;font-size:20px;line-height:1.3;resize:none;outline:none;font-family:"Caveat","Pixelify Sans",cursive;}
.bar{position:relative;height:26px;background:#231634;border:2px solid var(--edge);border-radius:8px;margin:16px 0 6px;overflow:hidden;}
.bar .zone{position:absolute;top:0;bottom:0;left:41%;width:18%;background:rgba(127,184,106,.55);}
.bar .mark{position:absolute;top:0;bottom:0;width:6px;left:0;background:var(--amber);border-radius:2px;}
.eyecv{background:#fbf8f0;border-radius:8px;width:170px;height:170px;margin:6px auto;display:block;}
.arrows{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;margin-top:8px;}
.arrows .pbtn{min-width:0;padding:6px;font-size:20px;}
#fade{display:flex;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .28s;}
#fade.on{opacity:1;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span id="roomName">Grace House</span><span id="falafel">&#129478; <b id="falafelCount">0</b></span></div>
  <div id="stage">
    <canvas id="game" width="320" height="288"></canvas>
    <div id="title" class="overlay show">
      <h1>The Haunting<br>of Grace House</h1>
      <div class="sub" id="titleSub">Season 1</div>
      <div class="enter">tap to enter</div>
    </div>
    <div id="panel" class="overlay"><div class="pbox" id="pbox"></div></div>
    <div id="dialogue" class="overlay">
      <div class="dbox">
        <div class="who" id="dWho"></div>
        <div class="txt" id="dTxt"></div>
        <div class="choices" id="dChoices" style="display:none"></div>
        <div class="hint" id="dHint">tap to continue</div>
      </div>
    </div>
    <div id="fade" class="overlay"></div>
  </div>
  <div id="controls">
    <div class="dpad">
      <button class="btn" id="up">&#9650;</button>
      <button class="btn" id="left">&#9664;</button>
      <button class="btn" id="right">&#9654;</button>
      <button class="btn" id="down">&#9660;</button>
    </div>
    <button class="btn" id="act">A</button>
  </div>
</div>

<script>
"use strict";
/* =============================================================
   THE HAUNTING OF GRACE HOUSE . SEASON 1
   Things you may want to edit live in CFG.
   URL switches:  ?reset      wipe progress
                  ?step=1..8  jump to a story point (testing)
                  ?dev        P approves / O rejects a pending poem (keyboard)
                  ?nolog      no network calls (testing)
   ============================================================= */
const CFG = {
  NTFY: "https://ntfy.sh",
  LOG_TOPIC: "gh-log-q8v3n1x7k2m9p4t6",    // subscribe to this one in the ntfy app
  CTRL_TOPIC: "gh-ctrl-z5r2w8c1j6h3f9b4",  // the game reads your approvals from here
  STATE_URL: "state.json",                 // optional fallback file in the repo: {"approvePoem": true}
  PASSWORD: "rainyday",
  COORDS: "43.432879, -80.298812"
};
const $ = function(id){ return document.getElementById(id); };
const QS = location.search || "";
const DEV = /[?&]dev\b/.test(QS), NOLOG = /[?&]nolog\b/.test(QS);
const SAVE_KEY = "gracehouse.s1.v1";

// ---------- save ----------
if (/[?&]reset\b/.test(QS)) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
let S = null;
try { S = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { S = null; }
if (!S || !S.f) S = { f:{}, falafel:0, poem:null, scene:"hall" };
const STEP_FLAGS = [
  [],
  ["intro","spooky"],                                   // 1 ready to go outside
  ["outside","nose","boysMet","gun","toldOff"],          // 2 Miguel crying, clinic open
  ["clinicSeen","clinicNote","noseFixed","compThought"], // 3 classroom open
  ["classSeen","pcHint","pcThought"],                   // 4 saw the locked computer
  ["grayNoticed","arturTalk"],                          // 5 Artur said Miguel likes poems
  ["password"],                                         // 6 has the password
  ["pcIn","blind"],                                     // 7 going blind
  ["glasses"]                                           // 8 glasses on, nap ready
];
(function(){
  const m = QS.match(/[?&]step=(\d)/); if(!m) return;
  const n = +m[1]; if(n < 1 || n >= STEP_FLAGS.length) return;
  S = { f:{}, falafel:0, poem:null, scene: n >= 8 ? "clinic" : "hall" };
  for(let i = 1; i <= n; i++) STEP_FLAGS[i].forEach(function(k){ S.f[k] = 1; });
  if(n >= 6) S.poem = { id:"dev", t:0, text:"(dev step)", status:"approved", given:true };
})();
const F = S.f;
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
save();

// ---------- logging + approvals (ntfy) ----------
function ntfyPost(url, body){
  if(NOLOG) return;
  try { fetch(url, { method:"POST", body:body }).catch(function(){}); } catch (e) {}
}
function logEvent(type, detail){
  const msg = detail ? type + ": " + detail : type;
  console.log("[LOG]", msg);
  ntfyPost(CFG.NTFY + "/" + CFG.LOG_TOPIC + "?title=" + encodeURIComponent("Grace House") + "&tags=ghost", msg);
}
function logPoem(p){
  console.log("[LOG] poem " + p.id + ": " + p.text);
  const ctrl = CFG.NTFY + "/" + CFG.CTRL_TOPIC;
  ntfyPost(CFG.NTFY, JSON.stringify({
    topic: CFG.LOG_TOPIC, title: "Grace wrote Miguel a poem", message: p.text, priority: 4, tags: ["scroll"],
    actions: [
      { action:"http", label:"Approve", url:ctrl, method:"POST", body:"approve " + p.id, clear:true },
      { action:"http", label:"Reject",  url:ctrl, method:"POST", body:"reject " + p.id,  clear:true }
    ]
  }));
}
let polling = false;
function pollCtrl(){
  if(polling || NOLOG) return;
  polling = true;
  const a = fetch(CFG.NTFY + "/" + CFG.CTRL_TOPIC + "/json?poll=1&since=all")
    .then(function(r){ return r.text(); })
    .then(function(t){ String(t).split("\n").forEach(function(line){
      if(!line.trim()) return;
      let m; try { m = JSON.parse(line); } catch (e) { return; }
      if(m && m.event === "message") applyCtrl(String(m.message || ""), m.time || 0);
    }); }).catch(function(){});
  const b = fetch(CFG.STATE_URL + "?t=" + Date.now(), { cache:"no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(s){ if(s && s.approvePoem) applyCtrl("approve *", 1e12); }).catch(function(){});
  Promise.all([a, b]).then(function(){ polling = false; }, function(){ polling = false; });
}
function applyCtrl(msg, time){
  const m = String(msg).trim().match(/^(approve|reject)\s+(\S+)/i); if(!m) return;
  const p = S.poem; if(!p || p.status !== "pending") return;
  if(m[2] === "*"){ if((time || 0) < (p.t || 0)) return; }
  else if(m[2] !== p.id) return;
  p.status = /^approve$/i.test(m[1]) ? "approved" : "rejected";
  save(); logEvent("poem_" + p.status, "Miguel's reaction is unlocked");
}
setInterval(function(){ if(S.poem && S.poem.status === "pending") pollCtrl(); }, 20000);

// ---------- tiny sound effects ----------
let AC = null;
function sfx(kind){
  try {
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    const P = { blip:[660,880,0.06,"square",0.05], bonk:[200,55,0.28,"triangle",0.4], crack:[900,120,0.12,"sawtooth",0.25],
                chime:[660,1320,0.45,"sine",0.18], click:[1200,900,0.04,"square",0.04], sob:[320,200,0.35,"sine",0.12] }[kind];
    if(!P) return;
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = P[3]; o.frequency.setValueAtTime(P[0], t); o.frequency.exponentialRampToValueAtTime(P[1], t + P[2]);
    g.gain.setValueAtTime(P[4], t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[2]);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + P[2] + 0.02);
  } catch (e) {}
}

// ---------- canvas + helpers ----------
const cv = $("game"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const TILE = 16, W = cv.width, H = cv.height;
function mk(w, h){ const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.imageSmoothingEnabled = false; return { c:c, g:g }; }
function rng(seed){ let s = seed >>> 0; return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function pline(g, x0, y0, x1, y1){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for(;;){ g.fillRect(x0, y0, 1, 1); if(x0 === x1 && y0 === y1) break; const e2 = 2 * err; if(e2 >= dy){ err += dy; x0 += sx; } if(e2 <= dx){ err += dx; y0 += sy; } }
}
function pdisc(g, cx, cy, r){ for(let y = -r; y <= r; y++) for(let x = -r; x <= r; x++) if(x*x + y*y <= r*r + r*0.5) g.fillRect(cx + x, cy + y, 1, 1); }
function pcircle(g, cx, cy, r){
  let x = r, y = 0, e = 1 - r;
  while(x >= y){
    [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]].forEach(function(p){ g.fillRect(cx + p[0], cy + p[1], 1, 1); });
    y++; if(e < 0) e += 2*y + 1; else { x--; e += 2*(y - x) + 1; }
  }
}
function rectLine(g, x, y, w, h){ g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1); g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h); }

// ---------- game state ----------
const G = { mode:"title", t:0, shake:0, cut:null, mini:null, scene:null, sceneId:"hall",
            walk:0, looks:0, fieldTime:0, nicTalks:0, ball:{ x:0, y:0, z:0, vis:false }, blurOn:null };
const player = { x:160, y:184, dir:"up", moving:false, frame:0, anim:0 };
const trail = [];
const cats = [
  { name:"Nellie", kind:"nellie", x:0, y:0, lag:10, pet:0 },
  { name:"Albert", kind:"albert", x:0, y:0, lag:20, pet:0 }
];
const cam = { x:0, y:0 };

// ---------- input ----------
const input = { up:0, down:0, left:0, right:0 };
function dirPress(k){ if(G.mode === "mini" && G.mini && G.mini.onDir) G.mini.onDir(k); }
function bindDir(id){
  const el = $(id);
  const on = function(e){ e.preventDefault(); if(!input[id]) dirPress(id); input[id] = 1; el.classList.add("pressed"); };
  const off = function(e){ e.preventDefault(); input[id] = 0; el.classList.remove("pressed"); };
  el.addEventListener("touchstart", on, { passive:false });
  el.addEventListener("touchend", off, { passive:false });
  el.addEventListener("touchcancel", off, { passive:false });
  el.addEventListener("mousedown", on); el.addEventListener("mouseup", off); el.addEventListener("mouseleave", off);
}
["up","down","left","right"].forEach(bindDir);
$("act").addEventListener("click", function(e){ e.preventDefault(); onAction(); });
const KEYS = { ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right" };
document.addEventListener("keydown", function(e){
  const tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  const k = KEYS[e.key];
  if(k){ e.preventDefault(); if(!input[k]) dirPress(k); input[k] = 1; const el = $(k); if(el) el.classList.add("pressed"); return; }
  if(e.key === " " || e.key === "Enter"){
    e.preventDefault(); const a = $("act"); a.classList.add("pressed"); setTimeout(function(){ a.classList.remove("pressed"); }, 120); onAction(); return;
  }
  if(G.mode === "dialogue" && dlg && dlg.shown && /^[1-4]$/.test(e.key)){ const ch = dlg.choices[+e.key - 1]; if(ch) pickChoice(ch); return; }
  if(DEV && (e.key === "p" || e.key === "o") && S.poem && S.poem.status === "pending"){
    applyCtrl((e.key === "p" ? "approve " : "reject ") + S.poem.id, 1e12);
  }
});
document.addEventListener("keyup", function(e){ const k = KEYS[e.key]; if(k){ input[k] = 0; const el = $(k); if(el) el.classList.remove("pressed"); } });

// ---------- dialogue ----------
let dlg = null, typeTimer = null, typed = 0;
const dEl = { wrap:$("dialogue"), who:$("dWho"), txt:$("dTxt"), hint:$("dHint"), choices:$("dChoices") };
function normLine(l){
  if(typeof l === "string") return { who:"", text:l, think:false };
  if(l[0] === "~") return { who:"Grace (thinking)", text:l[1], think:true };
  return { who:l[0], text:l[1], think:false };
}
function say(lines, opts){
  opts = opts || {};
  const prev = (G.mode === "dialogue") ? (dlg ? dlg.prev : "play") : G.mode;
  clearInterval(typeTimer);
  dlg = { lines:lines.map(normLine), i:0, choices:opts.choices || null, onEnd:opts.onEnd || null, prev:prev, shown:false };
  G.mode = "dialogue";
  dEl.wrap.classList.add("show");
  showLine();
}
function showLine(){
  const L = dlg.lines[dlg.i];
  dEl.who.textContent = L.who; dEl.who.className = "who" + (L.think ? " think" : "");
  dEl.txt.className = "txt" + (L.think ? " think" : "");
  typed = 0; dEl.txt.textContent = ""; dEl.hint.style.visibility = "hidden"; dEl.choices.style.display = "none";
  clearInterval(typeTimer);
  typeTimer = setInterval(function(){
    if(!dlg){ clearInterval(typeTimer); return; }
    typed++; dEl.txt.textContent = L.text.slice(0, typed);
    if(typed >= L.text.length){ clearInterval(typeTimer); lineDone(); }
  }, 16);
}
function lineDone(){ if(!dlg) return; if(dlg.i >= dlg.lines.length - 1 && dlg.choices) renderChoices(); else dEl.hint.style.visibility = "visible"; }
function renderChoices(){
  dEl.choices.innerHTML = "";
  dlg.choices.forEach(function(ch){
    const b = document.createElement("button"); b.textContent = ch.label;
    b.addEventListener("click", function(e){ e.stopPropagation(); pickChoice(ch); });
    dEl.choices.appendChild(b);
  });
  dEl.choices.style.display = "flex"; dlg.shown = true;
}
function pickChoice(ch){ closeDialogue(); if(ch.fn) ch.fn(); }
function advanceDialogue(){
  if(!dlg) return;
  const L = dlg.lines[dlg.i];
  if(typed < L.text.length){ clearInterval(typeTimer); typed = L.text.length; dEl.txt.textContent = L.text; lineDone(); return; }
  if(dlg.i < dlg.lines.length - 1){ dlg.i++; showLine(); return; }
  if(dlg.choices) return;
  const end = dlg.onEnd; closeDialogue(); if(end) end();
}
function closeDialogue(){
  clearInterval(typeTimer);
  const prev = dlg ? dlg.prev : "play";
  dlg = null; dEl.wrap.classList.remove("show");
  if(G.mode === "dialogue") G.mode = (prev === "dialogue" || prev === "title") ? "play" : prev;
}
dEl.wrap.addEventListener("click", advanceDialogue);

// ---------- panels (computer, poem, mini-games) ----------
const panelEl = $("panel"), pbox = $("pbox");
function openPanel(html){ pbox.innerHTML = html; pbox.style.filter = ""; panelEl.classList.add("show"); G.mode = "panel"; G.mini = null; }
function closePanel(){ panelEl.classList.remove("show"); pbox.innerHTML = ""; pbox.style.filter = ""; G.mini = null; if(G.mode === "panel" || G.mode === "mini") G.mode = "play"; }
function onClick(id, fn){ const el = $(id); if(el && el.addEventListener) el.addEventListener("click", function(e){ e.stopPropagation(); fn(e); }); }

// ---------- cutscenes ----------
function cutscene(steps){ G.cut = { steps:steps, i:-1, t:0 }; G.mode = "cut"; nextCut(); }
function nextCut(){
  const c = G.cut; if(!c) return;
  c.i++; c.t = 0;
  if(c.i >= c.steps.length){ G.cut = null; if(G.mode === "cut") G.mode = "play"; return; }
  const s = c.steps[c.i]; if(s.start) s.start();
}
function runCut(dt){
  const c = G.cut; if(!c){ G.mode = "play"; return; }
  const s = c.steps[c.i]; c.t += dt;
  const d = s.d || 0.0001, p = Math.min(1, c.t / d);
  if(s.upd) s.upd(p);
  if(c.t >= d) nextCut();
}

// ================= SPRITES =================
const PAL = {

function drawGrid(grid, pal, x0, y0, flip){
  for(let r = 0; r < grid.length; r++){
    const row = grid[r];
    for(let c = 0; c < row.length; c++){
      const ch = row[c]; if(ch === ".") continue;
      const col = pal[ch]; if(!col) continue;
      ctx.fillStyle = col; ctx.fillRect(x0 + (flip ? row.length - 1 - c : c), y0 + r, 1, 1);
    }
  }
}
function drawPerson(kind, pal, x, y, dir, frame, bob){
  const set = SPR[kind]; let grid, flip = false;
  if(dir === "down") grid = set.down[frame]; else if(dir === "up") grid = set.up[frame]; else { grid = set.side[frame]; flip = (dir === "left"); }
  const x0 = Math.round(x - 6), y0 = Math.round(y - 14) + (bob || 0);
  ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(x0 + 2, Math.round(y - 1), 8, 2);
  drawGrid(grid, pal, x0, y0, flip);
  return { x0:x0, y0:y0, flip:flip };
}
function opx(o, c, r, col){ ctx.fillStyle = col; ctx.fillRect(o.x0 + (o.flip ? 11 - c : c), o.y0 + r, 1, 1); }

function drawGrace(){
  const o = drawPerson("grace", PAL.grace, player.x, player.y, player.dir, player.moving ? player.frame : 0, (player.moving && player.frame === 1) ? 1 : 0);
  const d = player.dir, broken = F.nose && !F.noseFixed, band = !!F.noseFixed, gl = PAL.grace.G;
  if(d === "down"){
    if(broken){ opx(o,5,6,"#c0444f"); opx(o,6,6,"#c0444f"); opx(o,5,7,"#a33440"); }
    if(band){ for(let c = 4; c <= 7; c++) opx(o,c,6,"#f1ead9"); opx(o,5,6,"#d8c6a6"); }
    if(F.glasses){
      for(let r = 4; r <= 6; r++) [2,3,4,7,8,9].forEach(function(c){ if(r === 5 && (c === 3 || c === 8)) return; opx(o,c,r,gl); });
      opx(o,5,5,gl); opx(o,6,5,gl);
    }
  } else if(d !== "up"){
    if(broken) opx(o,9,4,"#c0444f");
    if(band){ opx(o,8,4,"#f1ead9"); opx(o,9,4,"#f1ead9"); }
    if(F.glasses){ [[5,3],[6,3],[7,3],[8,3],[10,3],[8,4],[9,4],[10,4]].forEach(function(p){ opx(o,p[0],p[1],gl); }); }
  }
}

function drawNPC(n){
  const frame = n.walk ? (Math.floor(G.t * 6) % 2) : 0;
  const crying = (n.id === "miguel" && F.toldOff && !F.password);
  const bob = crying ? (Math.floor(G.t * 4) % 2) : 0;
  const o = drawPerson(n.kind, n.pal, n.x, n.y, n.dir, frame, bob);
  if(crying && n.dir !== "up"){
    const k = Math.floor(G.t * 5) % 3;
    if(n.dir === "down"){ opx(o,3,6+k,"#8fc1ff"); opx(o,8,6+k,"#8fc1ff"); } else opx(o,9,5+k,"#8fc1ff");
  }
  if(n.id === "nic" && F.pcHint){
    if(n.dir === "down"){ opx(o,2,6,"#e8899a"); opx(o,9,6,"#e8899a"); } else if(n.dir !== "up") opx(o,7,5,"#e8899a");

}

const DARK = mk(W, H);
function drawDarkness(alpha, lights){
  const d = DARK.g;
  d.globalCompositeOperation = "source-over"; d.clearRect(0, 0, W, H);
  d.fillStyle = "rgba(7,4,12," + alpha.toFixed(3) + ")"; d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = "destination-out";
  lights.forEach(function(L){
    const x = L.x - cam.x, y = L.y - cam.y;
    const gr = d.createRadialGradient(x, y, 0, x, y, L.r);
    gr.addColorStop(0, "rgba(255,255,255," + L.s + ")"); gr.addColorStop(1, "rgba(255,255,255,0)");
    d.fillStyle = gr; d.beginPath(); d.arc(x, y, L.r, 0, Math.PI * 2); d.fill();
  });
  d.globalCompositeOperation = "source-over";
  ctx.drawImage(DARK.c, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = "soft-light";
  lights.forEach(function(L){
    if(!L.tint) return;
    const x = L.x - cam.x, y = L.y - cam.y;
    const gr = ctx.createRadialGradient(x, y, 0, x, y, L.r);
    gr.addColorStop(0, L.tint + L.ta + ")"); gr.addColorStop(1, L.tint + "0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, L.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

for(let i = 0; i < 10; i++) wisps.push({ x:Math.random()*W, y:Math.random()*H, r:1 + Math.random()*1.5, vx:(Math.random()-0.5)*9, vy:-6 - Math.random()*9, a:0.1 + Math.random()*0.2 });
function drawWisps(dt){
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  wisps.forEach(function(w){
    w.x += w.vx * dt; w.y += w.vy * dt;
    if(w.y < -4){ w.y = H + 4; w.x = Math.random() * W; }
    if(w.x < -4) w.x = W + 4; if(w.x > W + 4) w.x = -4;
    const tw = w.a * (0.6 + 0.4 * Math.sin(G.t * 3 + w.x));

    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

function buildHall(g, grid){
  const gw = grid[0].length, gh = grid.length;
  const cellOf = function(x, y){ return (x < 0 || y < 0 || x >= gw || y >= gh) ? "#" : grid[y][x]; };
  const R = rng(1337), ri = function(n){ return (R() * n) | 0; };
  g.fillStyle = "#07040c"; g.fillRect(0, 0, gw*TILE, gh*TILE);
  const tones = ["#2b2030","#2f2436","#271d2c","#322638"];
  for(let y = 1; y < gh - 1; y++) for(let x = 1; x < gw - 1; x++){
    const px = x*TILE, py = y*TILE;
    for(let k = 0; k < 2; k++){
      const yy = py + k*8;
      g.fillStyle = tones[ri(4)]; g.fillRect(px, yy, TILE, 8);
      g.fillStyle = "rgba(255,235,210,0.05)"; g.fillRect(px, yy, TILE, 1);
      g.fillStyle = "#1b1322"; g.fillRect(px, yy + 7, TILE, 1);
      if(R() < 0.5) g.fillRect(px + 2 + ri(12), yy, 1, 7);
      if(R() < 0.6){ g.fillStyle = "rgba(0,0,0,0.2)"; g.fillRect(px + 1 + ri(9), yy + 2 + ri(3), 5, 1); }
      if(R() < 0.04){ g.fillStyle = "#1e1625"; g.fillRect(px + 2 + ri(11), yy + 3, 2, 2); }
    }
  }
  // rug
  let a = 99, b = 99, c = -1, d = -1;
  for(let y = 0; y < gh; y++) for(let x = 0; x < gw; x++) if(grid[y][x] === "r"){ a = Math.min(a,x); b = Math.min(b,y); c = Math.max(c,x); d = Math.max(d,y); }
  if(c >= 0){
    const rx = a*TILE, ry = b*TILE, rw = (c-a+1)*TILE, rh = (d-b+1)*TILE, cx = rx + (rw>>1), cy = ry + (rh>>1);
    g.fillStyle = "#d9cbb0"; for(let yy = ry + 2; yy < ry + rh - 1; yy += 3){ g.fillRect(rx - 3, yy, 3, 1); g.fillRect(rx + rw, yy, 3, 1); }
    g.fillStyle = "#3a1620"; g.fillRect(rx, ry, rw, rh);
    g.fillStyle = "#c8842f"; rectLine(g, rx + 2, ry + 2, rw - 4, rh - 4);
    g.fillStyle = "#5a2230"; g.fillRect(rx + 4, ry + 4, rw - 8, rh - 8);
    g.fillStyle = "#c8842f";
    for(let i = 0; i <= 13; i++){ g.fillRect(cx+i, cy+13-i, 1, 1); g.fillRect(cx-i, cy+13-i, 1, 1); g.fillRect(cx+i, cy-13+i, 1, 1); g.fillRect(cx-i, cy-13+i, 1, 1); }
    g.fillStyle = "#7a2d3f";
    for(let i = 0; i <= 6; i++){ g.fillRect(cx+i, cy+6-i, 1, 1); g.fillRect(cx-i, cy+6-i, 1, 1); g.fillRect(cx+i, cy-6+i, 1, 1); g.fillRect(cx-i, cy-6+i, 1, 1); }
    g.fillStyle = "#c8842f"; g.fillRect(cx - 1, cy - 1, 2, 2);
    [[8,8],[rw-10,8],[8,rh-10],[rw-10,rh-10]].forEach(function(o){ g.fillRect(rx + o[0], ry + o[1], 2, 2); });
  }
  // wear
  g.fillStyle = "rgba(8,4,12,0.35)"; pdisc(g,70,200,6); pdisc(g,77,203,4); pdisc(g,390,120,7); pdisc(g,430,230,5); pdisc(g,300,50,4);
  g.fillStyle = "rgba(8,4,12,0.85)";
  const crack = function(x, y, n){ for(let i = 0; i < n; i++){ g.fillRect(x, y, 1, 1); x += 1; y += ri(3) - 1; if(R() < 0.08) pline(g, x, y, x + 3, y + 3); } };
  crack(60,130,18); crack(330,200,22); crack(460,70,14);

  g.fillStyle = "rgba(170,190,230,0.16)";
  for(let i = 0; i < 9; i++){ const x = 40 + i*14, y = 236 - i*6 + (i % 2 ? 5 : -3); g.fillRect(x, y+2, 3, 2); g.fillRect(x-1, y, 1, 1); g.fillRect(x+1, y-1, 1, 1); g.fillRect(x+3, y, 1, 1); }
  WINDOW_TX.forEach(function(tx){ const px = tx*TILE; g.fillStyle = "rgba(70,95,140,0.30)"; g.fillRect(px+3,36,10,1); g.fillRect(px+1,37,14,3); g.fillRect(px+3,40,10,1); g.fillStyle = "rgba(220,235,255,0.35)"; g.fillRect(px+5,38,2,1); g.fillRect(px+10,38,1,1); });
  // walls
  const fl = function(x, y){ return cellOf(x, y) !== "#"; };
  for(let y = 0; y < gh; y++) for(let x = 0; x < gw; x++){
    if(grid[y][x] !== "#") continue;
    const px = x*TILE, py = y*TILE, below = fl(x, y+1), y0 = below ? py + 6 : py, h = below ? 10 : TILE;
    g.fillStyle = "#241a30"; g.fillRect(px, y0, TILE, h);
    g.fillStyle = "#2b2039"; g.fillRect(px+3, y0, 2, h); g.fillRect(px+11, y0, 2, h);
    g.fillStyle = "#3b2a52";
    for(let yy = y0 + ((x+y) % 2 ? 2 : 5); yy < y0 + h - 1; yy += 6){ g.fillRect(px+8, yy-1, 1, 1); g.fillRect(px+7, yy, 3, 1); g.fillRect(px+8, yy+1, 1, 1); }
    if(R() < 0.08){ g.fillStyle = "rgba(8,4,12,0.4)"; g.fillRect(px+2+ri(8), y0+1, 5, 2); g.fillRect(px+4+ri(6), y0+3, 1, 3+ri(4)); }
    if(below){
      g.fillStyle = "#2c2138"; g.fillRect(px, py, TILE, 5);

        g.fillStyle = "#4a3328"; g.fillRect(px, py+10, TILE, 1);

    g.fillStyle = "#4a3328"; g.fillRect(px+7,2,2,10); g.fillRect(px+3,7,10,1);
    g.fillStyle = "#dfe8ff"; g.fillRect(px+10,3,2,2);
    g.fillStyle = "#4a1a26"; g.fillRect(px+1,1,2,12); g.fillRect(px+13,1,2,12);
    g.fillStyle = "#3a1220"; g.fillRect(px+2,1,1,12); g.fillRect(px+13,1,1,12);
    g.fillStyle = "#6a5040"; g.fillRect(px+1,13,14,2);

  PORTRAIT_TX.forEach(function(tx){
    const px = tx*TILE;

    g.fillStyle = "#c8842f"; g.fillRect(px+3,2,1,1); g.fillRect(px+12,2,1,1); g.fillRect(px+3,13,1,1); g.fillRect(px+12,13,1,1);

  const web = function(cx, cy, sx, sy, r){
    g.fillStyle = "rgba(222,228,245,0.30)";
    const rays = [[1,0],[0.92,0.38],[0.7,0.7],[0.38,0.92],[0,1]];
    rays.forEach(function(q){ pline(g, cx, cy, cx + sx*q[0]*r, cy + sy*q[1]*r); });
    [0.4,0.7,1].forEach(function(f){ for(let i = 0; i < rays.length - 1; i++){ const A = rays[i], B = rays[i+1]; pline(g, cx+sx*A[0]*r*f, cy+sy*A[1]*r*f, cx+sx*B[0]*r*f, cy+sy*B[1]*r*f); } });
  };
  web(TILE,TILE,1,1,18); web((gw-1)*TILE,TILE,-1,1,18); web(TILE,(gh-1)*TILE,1,-1,18); web((gw-1)*TILE,(gh-1)*TILE,-1,-1,18);
}

function roomGrid(w, h, items){

      if(y <= 1 || x === 0 || x === w-1 || y === h-1) c = "#";

// ================= ENGINE =================
function frontPoint(){ const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[player.dir]; return { x:player.x + d[0]*12, y:player.y - 3 + d[1]*12 }; }
function npcAtPoint(fx, fy){ const n = G.scene.npcs; for(let i = 0; i < n.length; i++){ if(Math.abs(n[i].x - fx) < 10 && Math.abs(n[i].y - 6 - fy) < 12) return n[i]; } return null; }
function catAtPoint(fx, fy){ for(let i = 0; i < cats.length; i++){ if(Math.abs(cats[i].x - fx) < 9 && Math.abs(cats[i].y - 4 - fy) < 10) return cats[i]; } return null; }
function petCat(c){
  const now = performance.now();
  if(now - c.pet < 1500){ say([[c.name, c.name === "Nellie" ? "(Nellie has had enough of you for now.)" : "(Albert is busy being fluffy. Later.)"]]); return; }
  c.pet = now; S.falafel += 10; save();
  say([[c.name, c.name === "Nellie" ? "(Nellie accepts your tribute. A yarn appears. +10 falafel.)" : "(Albert sheds on you lovingly. +10 falafel.)"]]);
}
function onAction(){
  if(G.mode === "title"){ startGame(); return; }
  if(G.mode === "dialogue"){ advanceDialogue(); return; }
  if(G.mode === "mini"){ if(G.mini && G.mini.onA) G.mini.onA(); return; }
  if(G.mode !== "play") return;
  const fp = frontPoint();
  const n = npcAtPoint(fp.x, fp.y);
  if(n){ if(!(G.sceneId === "field" && fieldPhase() === "A")) faceTo(n, player); n.talk(); return; }
  const c = catAtPoint(fp.x, fp.y); if(c){ petCat(c); return; }
  const f = facingCell();
  if(G.scene.interact) G.scene.interact(f.tx, f.ty, f.c);
}
function npcBlock(nx, ny){
  const ns = G.scene.npcs;
  for(let i = 0; i < ns.length; i++){
    const n = ns[i];
    if(Math.abs(nx - n.x) < 9 && Math.abs(ny - n.y) < 7){
      if(Math.hypot(nx - n.x, ny - n.y) < Math.hypot(player.x - n.x, player.y - n.y)) return true;
    }
  }
  return false;
}
function moveAxis(dx, dy){
  const sc = G.scene, hw = 4, top = -5, bot = 1;
  if(dx !== 0){
    const nx = player.x + dx, tx = Math.floor((dx > 0 ? nx + hw : nx - hw) / TILE);
    const t1 = Math.floor((player.y + top) / TILE), t2 = Math.floor((player.y + bot) / TILE);
    if(!solidAt(sc, tx, t1) && !solidAt(sc, tx, t2) && !npcBlock(nx, player.y)) player.x = nx;
  }
  if(dy !== 0){
    const ny = player.y + dy, ty = Math.floor((dy > 0 ? ny + bot : ny + top) / TILE);
    const l = Math.floor((player.x - hw) / TILE), r = Math.floor((player.x + hw) / TILE);
    if(!solidAt(sc, l, ty) && !solidAt(sc, r, ty) && !npcBlock(player.x, ny)) player.y = ny;
  }
}
function movePlayer(dt){
  const sp = 70; let vx = 0, vy = 0;
  if(input.up){ vy = -1; player.dir = "up"; } else if(input.down){ vy = 1; player.dir = "down"; }
  if(input.left){ vx = -1; player.dir = "left"; } else if(input.right){ vx = 1; player.dir = "right"; }
  player.moving = (vx !== 0 || vy !== 0);
  if(vx && vy){ vx *= 0.7071; vy *= 0.7071; }
  if(player.moving){
    moveAxis(vx * sp * dt, 0); moveAxis(0, vy * sp * dt);
    trail.push({ x:player.x, y:player.y }); if(trail.length > 80) trail.shift();
    player.anim += dt; if(player.anim > 0.18){ player.anim = 0; player.frame ^= 1; }
    if(G.sceneId === "hall") G.walk += dt;
  } else player.frame = 0;
  const c = cellAt(G.scene, Math.floor(player.x / TILE), Math.floor(player.y / TILE));
  if(c === "X") goScene("hall", G.sceneId);
}
function update(dt){
  G.t += dt; if(G.shake > 0) G.shake -= dt;
  if(G.mode === "play") movePlayer(dt); else { player.moving = false; player.frame = 0; }
  if(G.mode === "cut") runCut(dt);
  if(G.mode === "mini" && G.mini && G.mini.update) G.mini.update(dt);
  cats.forEach(function(c){ const idx = trail.length - 1 - c.lag; if(idx >= 0){ const p = trail[idx]; c.x += (p.x - c.x) * Math.min(1, dt * 6); c.y += (p.y - c.y) * Math.min(1, dt * 6); } });
  if(G.scene.update) G.scene.update(dt);
}
function updateCam(){
  const sc = G.scene;
  cam.x = sc.pw <= W ? Math.floor((sc.pw - W) / 2) : Math.floor(clamp(player.x - W/2, 0, sc.pw - W));
  cam.y = sc.ph <= H ? Math.floor((sc.ph - H) / 2) : Math.floor(clamp(player.y - H/2, 0, sc.ph - H));
}
function render(dt){
  updateCam();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#07040c"; ctx.fillRect(0, 0, W, H);
  const sx = G.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0, sy = G.shake > 0 ? Math.round((Math.random() - 0.5) * 4) : 0;
  const sc = G.scene;
  ctx.save(); ctx.translate(-cam.x + sx, -cam.y + sy);
  ctx.drawImage(sc.layer, 0, 0);
  if(sc.live) sc.live(ctx);
  const ents = [{ y:player.y, f:drawGrace }];
  cats.forEach(function(c){ ents.push({ y:c.y, f:function(){ drawCat(c); } }); });
  sc.npcs.forEach(function(n){ ents.push({ y:n.y, f:function(){ drawNPC(n); } }); });
  if(G.sceneId === "field" && G.ball.vis) ents.push({ y:G.ball.y, f:drawBall });
  ents.sort(function(a, b){ return a.y - b.y; }).forEach(function(e){ e.f(); });
  ctx.restore();
  if(sc.light) sc.light();
  if(sc.wisps) drawWisps(dt);
}
function applyBlur(){ const on = !!(F.blind && !F.glasses); if(G.blurOn === on) return; G.blurOn = on; cv.style.filter = on ? "blur(2.4px)" : "none"; }
let hudLast = "", hudF = -1;
function updateHUD(){
  const t = (G.mode === "title") ? "Grace House" : (G.scene.hint ? G.scene.hint() : G.scene.label);
  if(t !== hudLast){ hudLast = t; $("roomName").textContent = t; }
  if(S.falafel !== hudF){ hudF = S.falafel; $("falafelCount").textContent = S.falafel; }
}
function startGame(){
  if(G.mode !== "title") return;
  sfx("blip");
  $("title").classList.remove("show");
  G.mode = "play";
  logEvent("opened", F.intro ? "came back to the house" : "opened the game for the first time");
  if(!F.intro){
    F.intro = 1; save();
    say([["~","Where... am I?"],["~","This isn't my house. I don't think this is anyone's house."],["~","The last thing I remember is falling asleep."],"(Move with the pad. Press A to look at things and talk to people.)"]);
    return;
  }
  if(G.scene.onEnter) G.scene.onEnter("load");
}
let lastT = 0;
function loop(now){
  const dt = Math.min(0.05, ((now - lastT) || 16) / 1000); lastT = now;
  update(dt); updateHUD(); applyBlur(); render(dt);
  requestAnimationFrame(loop);
}

// ================= BOOT =================
enterScene(SCENES[S.scene] ? S.scene : "hall", "load");
$("titleSub").textContent = F.napped ? "Season 1 complete" : "Season 1";
$("title").addEventListener("click", startGame);
if(S.poem && S.poem.status === "pending") pollCtrl();
requestAnimationFrame(loop);
</script>
